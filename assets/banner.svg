      <path d="M330 90 L340 320"/>
      <path d="M330 90 L150 250"/>
      <path d="M520 30 L560 270"/>
      <path d="M520 30 L340 320"/>
      <path d="M720 85 L560 270"/>
      <path d="M720 85 L760 330"/>
      <path d="M910 25 L960 265"/>
      <path d="M910 25 L760 330"/>
      <path d="M1090 80 L960 265"/>
      <path d="M1090 80 L1130 320"/>
      <path d="M0 60 L150 250"/>
      <path d="M1200 40 L1130 320"/>
      <path d="M720 85 L960 265"/>
      <path d="M330 90 L560 270"/>
      <path d="M520 30 L760 330" stroke-opacity="0.04"/>

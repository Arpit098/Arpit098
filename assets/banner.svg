      <circle cx="720" cy="85" r="3"/><circle cx="910" cy="25" r="3"/><circle cx="1090" cy="80" r="3"/>
      <circle cx="150" cy="250" r="3"/><circle cx="340" cy="320" r="3"/><circle cx="560" cy="270" r="3"/>
      <circle cx="760" cy="330" r="3"/><circle cx="960" cy="265" r="3"/><circle cx="1130" cy="320" r="3"/>
    </g>

    <!-- terminal icon -->
    <g transform="translate(92 70) rotate(-6 100 100)">
      <rect x="14" y="16" width="200" height="200" rx="44" fill="url(#iconSide)"/>
      <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#icon)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
      <circle cx="46" cy="42" r="5" fill="#EF4444"/>
      <circle cx="64" cy="42" r="5" fill="#E5E5E5"/>

    <!-- text -->
    <text x="360" y="178" font-family="Georgia,'Palatino Linotype',Palatino,'Times New Roman',serif" font-size="64" fill="#ffffff">Hey ! I’m Arpit Agrawala</text>
    <text x="1064" y="238" text-anchor="end" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#e6e6e6">Software Engineer</text>
    <rect x="964" y="252" width="62" height="3" rx="1.5" fill="#3B82F6"/>
    <rect x="1030" y="252" width="34" height="3" rx="1.5" fill="#EF4444"/>

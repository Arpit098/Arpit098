    <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.2">
      <path d="M0 60 L170 20 L330 90 L520 30 L720 85 L910 25 L1090 80 L1200 40"/>
      <path d="M0 300 L150 250 L340 320 L560 270 L760 330 L960 265 L1130 320 L1200 285"/>
